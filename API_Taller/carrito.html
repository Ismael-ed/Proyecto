<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Talleres Casti</title>
    <link rel="shortcut icon" href="img/tools.svg" type="image/x-icon">
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="css/breakpoint.css">
    <link rel="stylesheet" href="css/carritostyle.css">
</head>
<body> 
    
    <header class="simple-header">
        <div class="header-content">
            <a href="index.html">
                <i class="bi bi-arrow-left flex-arrow"></i>
            </a>
        </div>
    </header>

    <main> 
        <div class="container container-carrito"> 
            <div id="contenidoCarrito" class="mx-auto" style="max-width: 900px;">
                <h1 class="titulo-principal">TU CARRITO DE COMPRAS</h1>
                
                <div class="seccion-borde">
                    <h2 class="subtitulo-seccion">PRODUCTOS SELECCIONADOS:</h2>
                </div>

                <div id="lista-productos-carrito" class="mb-4">
                    <!-- El JavaScript cargará el contenido aquí -->
                </div>

                <div class="seccion-borde">
                    <h2 class="subtitulo-seccion">RESUMEN DEL PEDIDO:</h2>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-6 campo-info">
                        <label>Subtotal:</label>
                        <div id="subtotal-precio" class="caja-dato">0.00€</div>
                    </div>
                    <div class="col-6 campo-info">
                        <label>Descuento (Racha):</label>
                        <div id="descuento-aplicado" class="caja-dato">0%</div>
                    </div>
                </div>

                <div class="row mb-5">
                    <div class="col-12 d-flex justify-content-end align-items-center">
                        <span class="texto-total me-3">TOTAL:</span>
                        <div id="total-final" class="caja-status" style="font-size: 1.8rem; font-weight: bold;">0.00€</div>
                    </div>
                </div>

                <div class="acciones-finales"> 
                    <button type="button" id="btnVaciarCarrito" class="btn-outline-rojo">VACIAR CARRITO</button>
                    <button type="button" id="btnFinalizarCompra" class="btn-negro">FINALIZAR COMPRA</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/sesion.js"></script>
</body>
</html>
