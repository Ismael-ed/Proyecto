<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cita - Talleres Casti</title>
    <link rel="shortcut icon" href="img/tools.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="css/breakpoint.css">
    <link rel="stylesheet" href="css/cabecera-footer-style.css">
    <link rel="stylesheet" href="css/citastyle.css">
</head>
<body> 
    <header>
        <div class="cabecera-izquierda">
            <a href="index.html" class="text-decoration-none d-flex align-items-center">
                <i class="bi bi-tools logo-cabecera"></i>
                <span class="titulo-pagina">Talleres Casti</span>
            </a>
        </div>
        <nav class="menu-cabecera">
            <a href="tienda.html">Tienda</a>
            <a href="alquiler.html">Alquiler</a>
            <a href="cita.html">Cita</a>
        </nav>
        <div class="cabecera-derecha">
            <i class="bi bi-person-circle cuenta-cabecera"></i>
        </div>
    </header>
    <main> 
        <div class="container container-cita"> 
            <form id="formCita" class="mx-auto" style="max-width: 900px;">
                <h1 class="text-center mb-5 text-dark">FORMULARIO DE SOLICITUD</h1>
                <div class="border-top border-5 border-dark pt-2 mb-4">
                    <h2 class="text-dark">DATOS PERSONALES:</h2>
                </div>
                <div class="row g-4 mb-4">
                    <div class="col-12 col-md-6 d-flex align-items-center">
                        <label for="nombre" class="me-2 text-nowrap text-dark">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" class="form-control border-2 border-dark bg-light" required>
                    </div>
                    <div class="col-12 col-md-6 d-flex align-items-center">
                        <label for="correo" class="me-2 text-nowrap text-dark">Correo:</label>
                        <input type="email" id="correo" name="correo" class="form-control border-2 border-dark bg-light" required>
                    </div>
                </div>
                <div class="row g-4 mb-5 align-items-center">
                    <div class="col-12 col-md-7 d-flex align-items-center">
                        <label for="telefono" class="me-2 text-nowrap text-dark">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" class="form-control border-2 border-dark bg-light" required>
                    </div>
                    <div id="contenedor-registro-cita" class="col-12 col-md-5 d-flex justify-content-md-end align-items-center" style="display: none;">
                        <span class="me-3 fw-bold text-dark text-end" style="font: var(--subtitulo-5); line-height: 1.1;">
                            USUARIO<br>REGISTRADO
                        </span>
                        <div class="d-flex align-items-center justify-content-center bg-dark" style="width: 50px; height: 50px; border-radius: 12px;">
                            <span class="material-symbols-outlined text-success" style="font-size: 35px;">verified</span>
                        </div>
                    </div>
                </div>
                <div class="border-top border-5 border-dark pt-2 mb-4">
                    <h2 class="text-dark">DATOS CONSULTA:</h2>
                </div>
                <div class="row g-4 mb-4">
                    <div class="col-12 col-md-6 d-flex align-items-center">
                        <label for="numMatricula" class="me-2 text-nowrap text-dark">Matrícula:</label>
                        <input type="text" id="numMatricula" name="numMatricula" class="form-control border-2 border-dark bg-light" required>
                    </div>
                    <div class="col-12 col-md-6 d-flex align-items-center">
                        <label for="numIdC" class="me-2 text-nowrap text-dark">Nº Bastidor:</label>
                        <input type="text" id="numIdC" name="numIdC" class="form-control border-2 border-dark bg-light" required>
                    </div>
                </div>
                <div class="row g-4 mb-4">
                    <div class="col-12 d-flex align-items-center">
                        <label for="tipoConsulta" class="me-2 text-nowrap text-dark">Tipo de Consulta:</label>
                        <select id="tipoConsulta" name="tipoConsulta" class="form-select border-2 border-dark bg-light">
                            <option value="revision" selected>Revisión</option>
                            <option value="cambio de liquidos">Cambio de líquidos</option>
                            <option value="cambio de ruedas">Cambio de ruedas</option>
                            <option value="otros">Otros</option>
                        </select>
                    </div>
                </div>
                <div class="row g-4 mb-5">
                    <div class="col-12">
                        <label for="informacionAdicional" class="mb-2 d-block text-dark">Información Adicional:</label>
                        <textarea id="informacionAdicional" name="informacionAdicional" class="form-control border-2 border-dark bg-light" rows="4" style="resize: none;" placeholder="Describa brevemente el problema..."></textarea>
                    </div>
                </div>
                <div class="text-center pb-2"> 
                    <button type="button" id="btnEnviarCita" class="btn-producto w-100 py-3" style="max-width: 400px;">
                        SOLICITAR CITA
                    </button>
                </div>
            </form>
        </div>
    </main>
    <footer> 
        <p class="footer-descripcion">Teléfono: +34 000 00 00 00</p>
        <p class="footer-descripcion">Email: example@gmail.com</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/sesion.js"></script>
</body>
</html>
