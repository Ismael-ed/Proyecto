<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Talleres Casti</title>
    <link rel="shortcut icon" href="img/tools.svg" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="css/breakpoint.css">
    <link rel="stylesheet" href="css/cuentastyle.css">
</head>

<body>

    <header class="simple-header">
        <div class="header-content">
            <a href="index.html">
                <i class="bi bi-arrow-left flex-arrow"></i>
            </a>
        </div>
    </header>

    <main>
        <div class="container container-cuenta">
            <form id="formCuenta" class="mx-auto" style="max-width: 900px;">
                <h1 class="titulo-principal">MI PERFIL DE USUARIO</h1>

                <div class="seccion-borde">
                    <h2 class="subtitulo-seccion">INFORMACIÓN PERSONAL:</h2>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-6 campo-info">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" class="caja-dato">
                    </div>
                    <div class="col-6 campo-info">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" class="caja-dato" readonly
                            style="background-color: rgba(255,255,255,0.5); cursor: not-allowed;">
                    </div>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-6 campo-info">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" class="caja-dato">
                    </div>
                    <div class="col-6 campo-info">
                        <label>ID Cliente:</label>
                        <div id="display-id" class="caja-dato" style="background-color: rgba(255,255,255,0.5);">#00
                        </div>
                    </div>
                </div>

                <div class="row mb-5 align-items-center">
                    <div class="col-7">
                        <p class="texto-racha">RACHA DE CITAS (5 PARA DESCUENTO):</p>
                        <div id="contenedor-racha" class="racha-iconos">
                            <i class="bi bi-circle"></i>
                            <i class="bi bi-circle"></i>
                            <i class="bi bi-circle"></i>
                            <i class="bi bi-circle"></i>
                            <i class="bi bi-circle"></i>
                        </div>
                    </div>
                    <div class="col-5 d-flex justify-content-end">
                        <div id="status-descuento" class="caja-status">
                            <span class="material-symbols-outlined" id="descuento-icono">lock</span>
                            <span id="descuento-texto">SIN DESCUENTO ACTIVO</span>
                        </div>
                    </div>
                </div>

                <div class="acciones-finales">
                    <button type="submit" id="btnGuardarDatos" class="btn-negro">GUARDAR DATOS</button>
                    <button type="button" id="btnCerrarSesion" class="btn-outline-rojo" onclick="cerrarSesion()">CERRAR
                        SESIÓN</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/sesion.js"></script>
</body>

</html>
