<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Facturas - Talleres Casti</title>
    <link rel="shortcut icon" href="img/tools.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/breakpoint.css">
    <link rel="stylesheet" href="css/facturastyle.css">
</head>
<body> 
    
    <header class="simple-header">
        <div class="header-content">
            <a href="index.html">
                <i class="bi bi-arrow-left flex-arrow"></i>
            </a>
        </div>
    </header>

    <main> 
        <div class="container container-facturas"> 
            <div id="contenidoFacturas" class="mx-auto" style="max-width: 900px;">
                <h1 class="titulo-principal">HISTORIAL DE FACTURAS</h1>
                
                <div class="seccion-borde">
                    <h2 class="subtitulo-seccion">TUS DOCUMENTOS:</h2>
                </div>

                <div id="lista-facturas" class="mb-4">
                    <div class="caja-dato d-flex justify-content-between align-items-center mb-3">
                        <span>Buscando facturas en el sistema...</span>
                    </div>
                </div>

                <div class="info-adicional mt-5">
                    <div class="caja-status justify-content-center">
                        <i class="bi bi-info-circle"></i>
                        <span>LAS FACTURAS SE GENERAN AUTOMÁTICAMENTE AL FINALIZAR UN PEDIDO O ALQUILER</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
</body>
</html>
